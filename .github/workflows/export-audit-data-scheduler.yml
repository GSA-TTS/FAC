---
name: Export Audit Data to CSV Scheduler
on:
  workflow_dispatch:
  schedule:
    # Daily at 7:23 AM UTC. Semi-random time to avoid any scheduling conflicts in GHA.
    - cron: '23 7 * * *'

jobs:
  scheduled-audit-data-export:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - name: staging
          - name: production
    name: Run bulk data export
    uses: ./.github/workflows/export-audit-data-to-csv-scheduled.yml
    secrets: inherit
    with:
      environment: ${{ matrix.environment.name }}
