{% comment %} ALN/CFDA {% endcomment %}
<div class="usa-accordion">
    <label class="usa-accordion__heading" for="input_passthrough-names">
        <button type="button"
                class="usa-accordion__button"
                aria-expanded={% if form_user_input.passthrough_names %}"true"{% else %}"false"{% endif %}
                aria-controls="passthrough-names">Passthrough Names</button>
    </label>
    <div id="passthrough-names">
        <div class="usa-hint" id="passthrough-names-hint">Separate multiple names by newlines.</div>
        <textarea class="usa-textarea" id="input_passthrough-names" name="passthrough_names">{{form_user_input.passthrough_names}}</textarea>
    </div>
</div>
