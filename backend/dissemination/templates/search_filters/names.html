{% comment %} Names {% endcomment %}
<div class="usa-accordion">
    <label class="usa-accordion__heading" for="input_entity-names">
        <button type="button"
                class="usa-accordion__button"
                aria-expanded={% if form_user_input.entity_names %}"true"{% else %}"false"{% endif %}
                aria-controls="entity-names">Names (Entity, Auditee, or Auditor)</button>
    </label>
    <div id="entity-names">
        <div id="names-hint">Separate multiple names by newlines.</div>
        <textarea class="usa-textarea"
                  id="input_entity-names"
                  name="entity_names"
                  aria-describedby="names-hint">
            {{form_user_input.entity_names}}
        </textarea>
    </div>
</div>
