{% comment %} UEIs and EINs {% endcomment %}
<button type="button"
        class="usa-accordion__button"
        aria-expanded="true"
        aria-controls="ueis-and-eins">
    UEIs and EINs
</button>

<div id="ueis-and-eins">
    <label class="usa-sr-only" for="input_ueis-and-eins">
        UEIs and EINs
    </label>
    <div id="ueis-and-eins-hint">Separate multiple UEIs and EINs by commas or newlines.</div>
    <textarea class="usa-textarea"
              id="input_ueis-and-eins"
              name="ueis_and_eins"
              aria-describedby="ueis-and-eins-hint">
        {{ form_user_input.ueis_and_eins }}
    </textarea>
</div>
