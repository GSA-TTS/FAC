{% comment %} Federal Program Names {% endcomment %}
<div class="usa-accordion">
    <label class="usa-accordion__heading" for="input_federal-program-names">
        <button type="button"
                class="usa-accordion__button"
                aria-expanded={% if form_user_input.federal_program_name %}"true"{% else %}"false"{% endif %}
                aria-controls="federal-program-names">Federal Program Names</button>
    </label>
    <div id="federal-program-names">
        <div id="federal-program-names-hint">Separate multiple names newlines.</div>
        <textarea class="usa-textarea"
                  id="input_federal-program-name"
                  name="federal_program_names"
                  aria-describedby="federal-program-names-hint">
            {{form_user_input.federal_program_names}}
        </textarea>
    </div>
</div>
