{% comment %} ALNs/CFDAs {% endcomment %}
<div class="usa-accordion">
    <label class="usa-accordion__heading" for="input_alns">
        <button type="button"
                class="usa-accordion__button"
                aria-expanded={% if form_user_input.aln %}"true"{% else %}"false"{% endif %}
                aria-controls="alns">Assistance Listing Numbers (formerly CFDAs)</button>
    </label>
    <div id="alns">
        <div id="alns-hint">Separate multiple ALNs by commas or newlines.</div>
        <textarea class="usa-textarea"
                  id="input_alns"
                  name="alns"
                  aria-describedby="alns-hint">{{form_user_input.alns}}</textarea>
    </div>
</div>
